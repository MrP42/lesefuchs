name: Release

# Baut die signierte Tablet-App und haengt sie an ein GitHub-Release.
# Ausloeser: ein Tag wie v0.1.0 -- oder Start von Hand mit Versionsangabe.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne v, z. B. 0.1.1'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # versionCode aus der Version: 1.2.3 -> 10203 (monoton steigend)
          IFS='.' read -r MA MI PA <<< "$VERSION"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (versionCode $CODE)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle-Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Piper-Sprachmodell holen
        # Liegt wegen seiner Groesse (78 MB) nicht im Repo -- siehe android/README.md
        run: |
          mkdir -p android/app/src/main/assets   # Ordner ist im Repo leer/ignoriert
          cd android/app/src/main/assets
          curl -sSL -o piper.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-de_DE-thorsten-medium.tar.bz2
          tar xjf piper.tar.bz2
          mkdir -p piper-de
          mv vits-piper-de_DE-thorsten-medium/de_DE-thorsten-medium.onnx piper-de/model.onnx
          mv vits-piper-de_DE-thorsten-medium/tokens.txt piper-de/tokens.txt
          mv vits-piper-de_DE-thorsten-medium/MODEL_CARD piper-de/MODEL_CARD
          mv vits-piper-de_DE-thorsten-medium/espeak-ng-data piper-de/espeak-ng-data
          rm -rf piper.tar.bz2 vits-piper-de_DE-thorsten-medium
          du -sh piper-de

      - name: Signaturschluessel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 fehlt - ohne Schluessel waeren Updates nicht installierbar."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lesefuchs.jks"

      - name: APK bauen
        working-directory: android
        env:
          LESEFUCHS_KEYSTORE: ${{ runner.temp }}/lesefuchs.jks
          LESEFUCHS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LESEFUCHS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LESEFUCHS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PlesefuchsVersion=${{ steps.v.outputs.version }} \
            -PlesefuchsVersionCode=${{ steps.v.outputs.code }}

      - name: APK benennen und pruefen
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          DST=lesefuchs-${{ steps.v.outputs.version }}.apk
          cp "$SRC" "$DST"
          ls -lh "$DST"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$DST" | head -5
          echo "name=$DST" >> "$GITHUB_OUTPUT"

      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.v.outputs.version }}
          TAG=v$VERSION
          NOTES=$(cat <<TXT
          ## Installation auf dem Fire Tablet

          1. Einstellungen -> Sicherheit & Datenschutz -> Apps unbekannter Herkunft
             fuer den Silk-Browser erlauben.
          2. Diese Seite am Tablet oeffnen und unten unter **Assets** die Datei
             \`${{ steps.apk.outputs.name }}\` antippen.
          3. Nach dem Download **Oeffnen** -> installieren.

          Ein Update ueber eine vorhandene Installation behaelt Inhalte und
          Fortschritt. Aenderungen: siehe [CHANGELOG.md](../blob/main/CHANGELOG.md).
          TXT
          )
          # Das Beispielpaket muss an JEDEM Release haengen: die App holt es
          # ueber /releases/latest ("Beispielgeschichte laden").
          DEMO=$(ls content/*.lesepaket 2>/dev/null | head -1)
          echo "Beispielpaket: ${DEMO:-KEINES GEFUNDEN}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.name }}" $DEMO --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.name }}" $DEMO --title "Lesefuchs $VERSION" --notes "$NOTES"
          fi
